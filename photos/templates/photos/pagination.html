{% if page_obj.has_other_pages %}
<nav>
    <ul class="pager">
        {% if page_obj.has_previous %}
        <li class="previous"><a href="?page={{ page_obj.previous_page_number }}">&larr; Anteriores</a></li>
        {% endif %}
        <li>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</li>
        {% if page_obj.has_next %}
        <li class="next"><a href="?page={{ page_obj.next_page_number }}">Siguientes &rarr;</a></li>
        {% endif %}
    </ul>
</nav>
{% endif %}
